[project]
name = "translated-subtitles"
version = "0.2.0"
description = "AI subtitle generation, translation, and editing suite (Mac-first, mlx-whisper + Gemini)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "translated_subtitles contributors" }]

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",

    # Job queue (Redis-backed; zmq alt for Tauri to be added later)
    "arq>=0.26",

    # Persistence
    "aiosqlite>=0.20",

    # Subtitle / media core
    "ffmpeg-python>=0.2",
    "yt-dlp>=2025.2",
    "srt>=3.5",

    # Translation
    "google-generativeai>=0.8",

    # Utilities
    "pydantic>=2.9",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "loguru>=0.7",
]

[project.optional-dependencies]
mac = [
    # Apple Silicon native (default backend)
    "mlx-whisper>=0.4",
]
cpu = [
    # CI / Linux fallback only
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "syrupy>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api"]

# ───────────────────────────────────────────────────────────
# Tooling
# ───────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "packages", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic Depends/Body/Query/etc are evaluated once at
# function-definition time and are intentional — exclude them from B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["apps/web", "packages", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
